<html>
    <head>
        <title>Xem CCCD</title>

        <style>
            @import url("./css/xam.css");
        </style>

        <script src="./lib/ptb12.js"></script>

        <script>
            function xemCCCD() {
                var thongTin = layThongTinCCCD();

                var img = document.getElementById("imgCCCD");
                img.src = thongTin.src;
                img.style.display = "inline-block"; 

                document.getElementById("btnToggle").innerHTML = thongTin.btnText;
            }
        </script>
    </head>
    <body>

        <h2>THONG TIN CAN CUOC CONG DAN</h2>

        <button id="btnToggle" onclick="xemCCCD()">
            Xem CCCD
        </button>

        <br>

        <img id="imgCCCD" src="" alt="Anh CCCD">

    </body>
</html>
